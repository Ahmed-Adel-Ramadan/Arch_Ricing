general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session   # lock before it sleeps
    after_sleep_cmd = hyprctl dispatch dpms on  # avoid waking to a black screen
    ignore_dbus_inhibit = false
}

# Screen off after 5 minutes
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 10 minutes (locks first via before_sleep_cmd above)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}

